      "EvidenceBundleIntegrity": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "canonicalization",
          "digest",
          "signature"
        ],
        "properties": {
          "canonicalization": {
            "type": "string",
            "const": "OPENCOI_CANONICAL_JSON_V1"
          },
          "digest": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "algorithm",
              "value"
            ],
            "properties": {
              "algorithm": {
                "type": "string",
                "const": "SHA-256"
              },
              "value": {
                "type": "string",
                "pattern": "^[a-f0-9]{64}$"
              }
            }
          },
          "signature": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "algorithm",
              "keyId",
              "publicKeySpki",
              "publicKeyFingerprint",
              "value"
            ],
            "properties": {
              "algorithm": {
                "type": "string",
                "const": "Ed25519"
              },
              "keyId": {
                "type": "string",
                "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/@-]{0,199}$",
                "description": "Unauthenticated legacy v1 display metadata outside the canonical signed record. Do not use it for signer identity."
              },
              "publicKeySpki": {
                "type": "string",
                "pattern": "^[A-Za-z0-9_-]+$",
                "maxLength": 8192
              },
              "publicKeyFingerprint": {
                "type": "string",
                "pattern": "^[a-f0-9]{64}$"
              },
              "value": {
                "type": "string",
                "pattern": "^[A-Za-z0-9_-]{86}$"
              }
            }
          }
        }
      },
