  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "ocoi_sk_…"
      }
    },
    "parameters": {
      "VendorId": {
        "name": "vendorId",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      },
      "CertificateId": {
        "name": "certificateId",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      },
      "RequestId": {
        "name": "requestId",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      },
      "IdempotencyKey": {
        "name": "Idempotency-Key",
        "in": "header",
        "required": true,
        "schema": {
          "type": "string",
          "minLength": 8,
          "maxLength": 128,
          "pattern": "^[A-Za-z0-9._:-]{8,128}$"
        }
      },
      "Limit": {
        "name": "limit",
        "in": "query",
        "schema": {
          "type": "integer",
          "minimum": 1,
          "maximum": 100,
          "default": 50
        }
      },
      "Cursor": {
        "name": "cursor",
        "in": "query",
        "schema": {
          "type": "string",
          "maxLength": 1024
        }
      }
    },
    "headers": {
      "XRequestId": {
        "description": "Stable request correlation UUID.",
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      },
      "OpenCoiVersion": {
        "description": "Date-based revision of the /api/v1 contract.",
        "schema": {
          "type": "string",
          "const": "2026-09-01"
        }
      },
      "IdempotentReplayed": {
        "description": "Present with value true only when a stored response was replayed.",
        "schema": {
          "type": "string",
          "enum": [
            "true"
          ]
        }
      },
      "ETag": {
        "description": "Strong entity tag for vendor optimistic concurrency.",
        "schema": {
          "type": "string"
        }
      },
      "Location": {
