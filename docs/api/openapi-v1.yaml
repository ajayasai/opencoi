    "/vendors/{vendorId}/certificates": {
      "post": {
        "summary": "Submit a certificate for human review",
        "description": "Uploads a PDF and extraction proposal. Service-account submissions are always unconfirmed and cannot satisfy a configured rule until an authorized person reviews them.",
        "operationId": "submitCertificate",
        "tags": [
          "Certificates"
        ],
        "x-required-scope": "certificates:write",
        "parameters": [
          {
            "$ref": "#/components/parameters/VendorId"
          },
