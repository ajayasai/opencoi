name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build release assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    env:
      TAG_NAME: ${{ github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v1.2.3 or v1.2.3-rc.1" >&2
            exit 1
          fi
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$TAG_NAME" != "v${package_version}" ]]; then
            echo "Tag $TAG_NAME does not match package.json version ${package_version}" >&2
            exit 1
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: Audit runtime license coverage
        run: npm run licenses:audit

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify source
        run: npm run check

      - name: Build application
        run: npm run build

      - name: Build container image
        run: |
          docker build --pull \
            --build-arg "VERSION=${TAG_NAME#v}" \
            --build-arg "VCS_REF=${GITHUB_SHA}" \
            --tag "opencoi:${TAG_NAME#v}" \
            .

      - name: Create application archive and SBOM
        shell: bash
        run: |
          set -euo pipefail
          package_version="${TAG_NAME#v}"
          archive_root="opencoi-${package_version}"
          mkdir -p "release/stage/${archive_root}"
          git archive "$GITHUB_SHA" | tar -x -C "release/stage/${archive_root}"
          cp -R dist "release/stage/${archive_root}/dist"
          npm sbom --omit=dev --sbom-format=cyclonedx > "release/${archive_root}.cdx.json"
          npm prune --omit=dev
          mkdir -p "release/stage/${archive_root}/third_party_licenses/runtime"
          npm run licenses:audit -- \
            "release/stage/${archive_root}/third_party_licenses/runtime-inventory.json"
          while IFS= read -r -d '' license_file; do
            relative_path="${license_file#node_modules/}"
            destination="release/stage/${archive_root}/third_party_licenses/runtime/${relative_path}"
            mkdir -p "$(dirname "$destination")"
            cp "$license_file" "$destination"
          done < <(
            find node_modules -type f \
              \( -iname 'LICENSE*' -o -iname 'LICENCE*' -o -iname 'COPYING*' -o -iname 'NOTICE*' \) \
              -print0
          )
          tar -C release/stage -czf "release/${archive_root}.tar.gz" "${archive_root}"
          (
            cd release
            sha256sum "${archive_root}.tar.gz" "${archive_root}.cdx.json" > SHA256SUMS
          )

      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/*.tar.gz
            release/*.cdx.json
            release/SHA256SUMS

      - name: Retain workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencoi-${{ github.ref_name }}
          path: |
            release/*.tar.gz
            release/*.cdx.json
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      TAG_NAME: ${{ github.ref_name }}

    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: opencoi-${{ github.ref_name }}
          path: release

      - name: Verify release asset checksums
        shell: bash
        run: cd release && sha256sum -c SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(release/*.tar.gz release/*.cdx.json release/SHA256SUMS)
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            prerelease=()
            if [[ "${TAG_NAME#v}" == *-* ]]; then
              prerelease=(--prerelease)
            fi
            gh release create "$TAG_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "OpenCOI $TAG_NAME" \
              --generate-notes \
              --verify-tag \
              "${prerelease[@]}"
          fi
