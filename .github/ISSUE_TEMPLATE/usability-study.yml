name: Usability study finding
description: Report an aggregate, privacy-reviewed workflow finding from a structured study.
title: "[Usability]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Use this public template only for aggregate findings and synthetic reproduction steps. Do not include participant names, contact details, employers, diagnoses, quotes, recordings, screenshots of participants, real certificates, policy identifiers, consent records, session IDs, recruitment details, or row-level study data.

        This issue is not itself a result publication. Link only to a result package that passed `research/usability/results/README.md`, or state that the finding is exploratory.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and evidence checks
      options:
        - label: I used only aggregate counts and synthetic reproduction data.
          required: true
        - label: Every reported cohort contains at least five participants, or the cell is suppressed.
          required: true
        - label: I excluded participant identities, quotes, recordings, free-text notes, and row-level observations.
          required: true
        - label: I am not presenting synthetic analyzer fixtures as participant evidence.
          required: true

  - type: input
    id: version
    attributes:
      label: OpenCOI commit tested
      description: Enter the full 40-character commit from the reviewed dataset.
      placeholder: 0123456789abcdef0123456789abcdef01234567
    validations:
      required: true

  - type: dropdown
    id: evidence_status
    attributes:
      label: Evidence status
      options:
        - Preregistered participant aggregate
        - Exploratory aggregate
        - Expert review without participant results
        - Synthetic reproduction only
    validations:
      required: true

  - type: dropdown
    id: role
    attributes:
      label: Affected workflow role
      options:
        - COI reviewer
        - Procurement or vendor-risk manager
        - Vendor uploader
        - Multiple roles
    validations:
      required: true

  - type: dropdown
    id: task
    attributes:
      label: Primary registered task
      options:
        - T01 Create requirements
        - T02 Create vendor link
        - T03 Vendor upload
        - T04 Review and correct
        - T05 Explain finding
        - T06 Decide exception
        - T07 Export status
        - T08 Renewal reminder
        - Cross-task navigation or comprehension
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: Highest observed impact
      options:
        - Critical safety, privacy, destructive, or blocking incident
        - Task not completed
        - Task completed only with assistance
        - Error or avoidable delay
        - Comprehension or confidence concern
    validations:
      required: true

  - type: textarea
    id: aggregate
    attributes:
      label: Aggregate evidence
      description: Give denominator, outcome count/rate, interval when applicable, study status, and a result-package link. Do not paste raw rows or participant text.
      placeholder: "Example: 4 of 7 participants required assistance (descriptive Wilson 95% interval ...)."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Describe the smallest reproduction using fictional names and synthetic files only.
      placeholder: |
        1. Seed the synthetic workspace ...
        2. Open ...
        3. Navigate using ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected accessible or usable behavior
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Claim boundary and limitations
      description: State the build, sample, task, environment, deviations, and why the finding does not establish universal superiority.
    validations:
      required: true
